# CIFAR-10 Color network config (<1000 neurons)
# Uses cifar10_color dataset (RGB, 32x32x3) with color-specific signal mapping.
dataset: cifar10_color
output_dir: networks
name: cifar10colored_v1
rgb_separate_neurons: true
layers:
  - type: conv
    kernel_size: 4
    stride: 2
    connectivity: 0.8
  - type: conv
    kernel_size: 4
    stride: 2
    connectivity: 0.6
  - type: dense
    size: 96
    connectivity: 0.25
